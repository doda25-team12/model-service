name: Train & Release Model

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Model version (e.g., v1.0.0 or 1.0.0)'
        required: true
        type: string
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string
        default: 'Model training and release'
  push:
    branches:
      - f9-automate-training
      - main

jobs:
  train-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate and normalize version
        id: version
        run: |
          VERSION="${{ inputs.version }}"

          # Only validate if triggered by workflow_dispatch (not push)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Validate semantic version format
            if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: Invalid version format. Expected: v1.2.3 or 1.2.3"
              exit 1
            fi

            # Normalize version (add 'v' prefix if missing)
            if [[ ! "$VERSION" =~ ^v ]]; then
              VERSION="v$VERSION"
            fi

            echo "normalized=$VERSION" >> $GITHUB_OUTPUT
            echo "Using version: $VERSION"
          else
            # For push events, use run number
            echo "normalized=model-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sync dependencies
        run: uv sync

      - name: Create output directory
        run: mkdir -p output

      - name: Download dataset
        run: uv run python src/get_data.py

      - name: Preprocess data
        run: uv run python src/text_preprocessing.py

      - name: Train model
        run: uv run python src/text_classification.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.normalized }}
          name: "Model Release ${{ steps.version.outputs.normalized }}"
          body: ${{ inputs.release_notes || 'Automated model release' }}
          files: |
            output/model.joblib
            output/preprocessor.joblib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}