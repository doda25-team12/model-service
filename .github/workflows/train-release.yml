name: Train & Release Model

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string
        default: 'Model training and release'
  push:
    branches:
      - f9-automate-training
      - main
      - F9-fix-pipeline
      - f9-release-semantic

jobs:
  train-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags

      - name: Calculate next version
        id: version
        run: |
          # Fetch the latest release tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            # No tags exist, start with v1.0.0
            NEW_VERSION="v1.0.0"
            echo "No previous releases found. Starting with: $NEW_VERSION"
          else
            echo "Latest tag: $LATEST_TAG"

            # Remove 'v' prefix if present
            VERSION=${LATEST_TAG#v}

            # Parse semantic version (MAJOR.MINOR.PATCH)
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            # Default to 0.0.0 if parsing fails
            MAJOR=${MAJOR:-0}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            # Increment patch version
            PATCH=$((PATCH + 1))

            # Construct new version
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            echo "Next version: $NEW_VERSION"
          fi

          echo "normalized=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sync dependencies
        run: uv sync

      - name: Create output directory
        run: mkdir -p output

      - name: Download dataset
        run: uv run python src/get_data.py

      - name: Preprocess data
        run: uv run python src/text_preprocessing.py

      - name: Train model
        run: uv run python src/text_classification.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.normalized }}
          name: "Model Release ${{ steps.version.outputs.normalized }}"
          body: ${{ inputs.release_notes || 'Automated model release' }}
          files: |
            output/model.joblib
            output/preprocessor.joblib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}